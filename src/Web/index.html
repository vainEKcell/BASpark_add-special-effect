<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
            pointer-events: none;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            background: transparent !important;
        }

        canvas {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <canvas id="sparkCanvas"></canvas>
    <script>
        // re: 动画常量集中定义，避免每帧 new 对象
        const FILLED_CIRCLE_CFG = { rAddRate: 26, maxLife: 16 };
        const RINGS_ANIM_CFG = {
            rsList: [0, 0.08, 0.1],
            rRoundRateList: [0, 1, 1.5, 2],
            len: 1.1 * Math.PI,
            maxLife: 23,
            segNum: 10,
            minW: 0.4,
            maxW: 3.3,
            lenStopAddPoint: 0.1,
            lenStartDimPoint: 0.4,
        };
        const CREATE_CLICK_CFG = {
            rings: {
                rsList: [0, 0.03, 0.06],
                rRoundRateList: [0, 1, 1.5, 2],
                len: 1.1 * Math.PI,
            },
            sparksCount: 4,
        };

        // 渲染基准（与上游默认一致）；渐变开关开启时叠加对应增强层
        const RENDER_PRESET = {
            trailPasses: [
                { lineWidth: 9, alphaMul: 0.05 },
                { lineWidth: 6.0, alphaMul: 0.5 },
                { lineWidth: 4.5, alphaMul: 1.0 },
            ],
            whiteCore: { lineWidth: 2.4, alphaMul: 0.5 },
            headGlow: 0.30,
            ringGlow: 0,
            ringStart: [250, 252, 252],
            sparkGlow: true,
            radialFill: true,
        };

        // 上游默认的光环末端颜色（向白色收敛），光圈渐变关闭时使用以保证逐像素还原
        function ringsEndColorFromRgb(rgbString) {
            return rgbString.split(',').map(Number).map((n) => (n + 255 * 2) / 3);
        }

        function parseRgbList(rgbString) {
            const parts = rgbString.split(',');
            const out = [0, 0, 0];
            for (let i = 0; i < 3; i++) {
                const n = parseInt(parts[i], 10);
                out[i] = Number.isFinite(n) ? Math.max(0, Math.min(255, n)) : 0;
            }
            return out;
        }

        function lerpRgbList(a, b, t) {
            return [
                Math.round(a[0] + (b[0] - a[0]) * t),
                Math.round(a[1] + (b[1] - a[1]) * t),
                Math.round(a[2] + (b[2] - a[2]) * t),
            ];
        }

        function mixTowardWhite(rgb, amount) {
            return lerpRgbList(rgb, [255, 255, 255], amount);
        }

        function clampStrength(value, fallback) {
            let n = Number(value);
            if (!Number.isFinite(n)) n = fallback;
            return Math.max(0, Math.min(1.5, n));
        }

        class MouseSpark {
            constructor(opts = {}) {
                this.color = opts.color || '45,175,255';
                this.colorSecondary = opts.colorSecondary || '255,255,255';
                this.ringColorSecondary = opts.ringColorSecondary || '255,255,255';
                this.gradientTrail = opts.gradientTrail != null ? Boolean(opts.gradientTrail) : true;
                this.gradientStrength = clampStrength(opts.gradientStrength, 1.0);
                this.ringGradient = opts.ringGradient != null ? Boolean(opts.ringGradient) : true;
                this.ringGradientStrength = clampStrength(opts.ringGradientStrength, 1.0);
                this.scale = opts.scale || 1.5;
                this.opacity = opts.opacity || 1.0;
                this.trailSpeed = opts.trailSpeed != null ? opts.trailSpeed : (opts.speed || 1.0);
                this.clickSpeed = opts.clickSpeed != null ? opts.clickSpeed : (opts.speed || 1.0);
                this.maxTrail = opts.maxTrail || 16;

                this.sparksPool = [];
                this.wavesPool = [];

                this.waves = [];
                this.sparks = [];
                this.trail = [];
                this.isDown = false;
                this.lastPos = null;
                this.baseFrameMs = 1000 / 60;
                this.maxDeltaMs = 100;
                this.lastFrameTime = performance.now();
                this.dpr = 1;
                this.cssWidth = 1;
                this.cssHeight = 1;
                this.previousDirtyRects = [];
                this.forceFullRedraw = true;


                this.ringsStartColor = [250, 252, 252];

                this.initCanvas();
                this.bindEvents();
            }

            get preset() {
                return RENDER_PRESET;
            }

            // 应用风格预设：刷新光环起始色等派生值
            applyStyle() {
                this.ringsStartColor = this.preset.ringStart.slice();
            }

            // 拖尾沿程颜色：t=0 光标端，t=1 尾端
            // gradientStrength 控制渐变强度：>1 时副色提前出现（更明显），0 为纯主色
            trailColorAt(t) {
                const main = parseRgbList(this.color);
                const secondary = parseRgbList(this.colorSecondary);
                if (!this.gradientTrail || this.gradientStrength <= 0) {
                    return main;
                }
                const p = Math.min(1, Math.max(0, t) * this.gradientStrength);
                return lerpRgbList(main, secondary, p);
            }

            bindEvents() {
                const getPos = (e) => ({ x: e.clientX, y: e.clientY });
                const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

                window.addEventListener("mousedown", (e) => {
                    this.isDown = true;
                    this.lastPos = getPos(e);
                    this.createEffects(this.lastPos.x, this.lastPos.y);
                });

                window.addEventListener("mousemove", (e) => {
                    if (!this.isDown && !window.effectiveAlwaysTrail) return;
                    const p = getPos(e);
                    const prev = this.lastPos;
                    if (!prev) {
                        this.lastPos = p;
                        return;
                    }
                    if (dist(p, prev) > 2) {
                        this.trail.push({ x: p.x, y: p.y, life: 1 });
                        if (this.trail.length > this.maxTrail) this.trail.shift();

                        if (Math.random() < 0.3) {
                            const a = Math.random() * Math.PI * 2;
                            const speedAdjust = this.scale / 1.5;
                            this.sparks.push({
                                x: p.x + Math.cos(a) * 10 * this.scale,
                                y: p.y + Math.sin(a) * 10 * this.scale,
                                vx: Math.cos(a) * 1.3 * speedAdjust,
                                vy: Math.sin(a) * 1.3 * speedAdjust,
                                rot: Math.random() * Math.PI * 2,
                                rs: 0.16,
                                s: 9 * this.scale,
                                a: 0.7,
                                f: 0.95,
                                fromClick: false,
                            });
                        }
                    }
                    this.lastPos = p;
                });

                window.addEventListener("mouseup", () => {
                    this.isDown = false;
                });
            }

            // 初始化画布 可见层 + 离屏缓冲
            // lighter合成后贴回，减轻主画布混合开销
            initCanvas() {
                // 主画布
                this.mainCanvas = document.getElementById("sparkCanvas");
                this.mainCtx = this.mainCanvas.getContext("2d");

                // 缓冲画布
                this.bufferCanvas = document.createElement("canvas");
                this.bufferCtx = this.bufferCanvas.getContext("2d");

                this.resize();

                // 监听窗口缩放
                window.addEventListener("resize", () => this.resize());
            }

            clearEffects() {
                this.waves = [];
                this.sparks = [];
                this.trail = [];
                this.isDown = false;
                this.lastPos = null;
                this.previousDirtyRects = [];
                this.forceFullRedraw = true;
                this.lastFrameTime = performance.now();
                if (this.mainCtx && this.mainCanvas) {
                    this.mainCtx.clearRect(0, 0, this.mainCanvas.width, this.mainCanvas.height);
                }
                if (this.bufferCtx && this.bufferCanvas) {
                    this.bufferCtx.clearRect(0, 0, this.bufferCanvas.width, this.bufferCanvas.height);
                }
            }

            alpha(value) {
                return Math.max(0, Math.min(1, value * this.opacity));
            }

            resize() {
                const dpr = window.devicePixelRatio || 1;
                const cssWidth = Math.max(1, window.innerWidth);
                const cssHeight = Math.max(1, window.innerHeight);
                const w = Math.max(1, Math.floor(cssWidth * dpr));
                const h = Math.max(1, Math.floor(cssHeight * dpr));

                this.dpr = dpr;
                this.cssWidth = cssWidth;
                this.cssHeight = cssHeight;
                this.mainCanvas.width = w;
                this.mainCanvas.height = h;
                this.bufferCanvas.width = w;
                this.bufferCanvas.height = h;
                this.previousDirtyRects = [];
                this.forceFullRedraw = true;

                this.bufferCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            // 中间的填充叫 filledCircle
            // 外围的弧线叫 ring
            // 它们合起来叫 wave


            // -=创建点击效果=-
            createEffects(x, y) {
                const rc = CREATE_CLICK_CFG.rings;
                const sparksCount = CREATE_CLICK_CFG.sparksCount;

                let wave;
                if (this.wavesPool.length > 0) {
                    wave = this.wavesPool.pop();
                } else {
                    wave = {};
                }
                if (!wave.ring) wave.ring = { segs: [] };

                // 赋值
                wave.x = x;
                wave.y = y;
                wave.r = 0;
                wave.life = 0;
                wave.ring.ang = Math.random() * Math.PI * 2;
                wave.ring.rs = rc.rsList[Math.floor(Math.random() * rc.rsList.length)];
                wave.ring.segs[0] = {
                    off: 0,
                    len: rc.len,
                    rRoundRate: rc.rRoundRateList[Math.floor(Math.random() * rc.rRoundRateList.length)],
                };
                wave.ring.segs[1] = {
                    off: (Math.random() * 3 - 1.5) * Math.PI,
                    len: rc.len,
                    rRoundRate: rc.rRoundRateList[Math.floor(Math.random() * rc.rRoundRateList.length)],
                };

                // 进入循环
                this.waves.push(wave);

                const speedAdjust = this.scale / 1.5;
                for (let i = 0; i < sparksCount; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const speed = (4.8 + Math.random() * 2) * speedAdjust;

                    // 创建
                    let spark;
                    if (this.sparksPool.length > 0) {
                        spark = this.sparksPool.pop();
                    } else {
                        spark = {};
                    }

                    // 赋值
                    spark.x = x;
                    spark.y = y;
                    spark.vx = Math.cos(a) * speed;
                    spark.vy = Math.sin(a) * speed;
                    spark.rot = Math.random() * Math.PI * 2;
                    spark.rs = (Math.random() - 0.5) * 0.28;
                    spark.s = (4 + Math.random() * 3) * this.scale;
                    spark.a = 1;
                    spark.f = 0.9;
                    spark.fromClick = true;
                    this.sparks.push(spark);
                }
            }

            _clearBuffer(rect) {
                const ctx = this.bufferCtx;
                if (rect) {
                    ctx.clearRect(rect.x, rect.y, rect.w, rect.h);
                } else {
                    ctx.clearRect(0, 0, this.cssWidth, this.cssHeight);
                }
            }

            _clearBufferRects(rects) {
                if (!rects || rects.length === 0) {
                    return;
                }

                for (const rect of rects) {
                    this._clearBuffer(rect);
                }
            }

            _updateTrail(frameScale) {
                const ctx = this.bufferCtx;
                const n = this.trail.length;
                let baseDecay;
                if (window.effectiveAlwaysTrail) {
                    baseDecay = 0.085 * frameScale;
                } else {
                    baseDecay = (this.isDown ? 0.085 : 0.18) * frameScale;
                }
                const maxStep = 0.42;
                for (let i = n - 1; i >= 0; i--) {
                    const t = this.trail[i];
                    const span = Math.max(1, n - 1);
                    const along = n > 1 ? i / span : 1;
                    const towardCursorBias = 1.25 - 0.55 * along;
                    let step = baseDecay * towardCursorBias;
                    if (step > maxStep) step = maxStep;
                    t.life -= step;
                    if (t.life <= 0) this.trail.splice(i, 1);
                }

                const head = this.lastPos;
                const pts =
                    head && this.trail.length > 0
                        ? this.trail.concat([{ x: head.x, y: head.y, life: 1 }])
                        : this.trail.slice();

                if (pts.length < 2) {
                    return;
                }

                const gap = Math.hypot(
                    pts[pts.length - 1].x - pts[pts.length - 2].x,
                    pts[pts.length - 1].y - pts[pts.length - 2].y
                );
                if (gap < 0.75 && this.trail.length === 1) {
                    const fade = Math.max(0, this.trail[0].life);
                    ctx.shadowColor = 'transparent';
                    ctx.beginPath();
                    ctx.arc(pts[0].x, pts[0].y, 2.5 + 2 * fade, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${this.color}, ${fade * 0.85})`;
                    ctx.fill();
                    return;
                }

                // 逐段渲染：每段的透明度基于数组索引位置，而非空间位置
                // 防止当鼠标锐角转动时，尾迹变淡后突然出现的问题
                const preset = this.preset;
                const gradientOn = this.gradientTrail && this.gradientStrength > 0;
                const passes = preset.trailPasses.map((p) => ({
                    lineWidth: p.lineWidth,
                    alphaMul: this.alpha(p.alphaMul),
                    kind: 'color',
                }));
                if (preset.whiteCore && gradientOn) {
                    passes.push({
                        lineWidth: preset.whiteCore.lineWidth,
                        alphaMul: this.alpha(preset.whiteCore.alphaMul),
                        kind: 'white',
                    });
                }

                const lastIdx = pts.length - 1;
                // 每段的透明度基于数组索引位置，而非空间索引
                if (window.ApplyCurveDraw) {
                    // 逐段渲染（Catmull-Rom → Cubic Bezier 曲线版）
                    for (const pass of passes) {
                        ctx.lineWidth = pass.lineWidth;
                        for (let i = 0; i < lastIdx; i++) {
                            const a0 = pts[i];
                            const a1 = pts[i + 1];

                            // Catmull-Rom 控制点：CP1 = P_i + (P_{i+1} - P_{i-1}) / 6
                            //                      CP2 = P_{i+1} - (P_{i+2} - P_i) / 6
                            const prev = i > 0 ? pts[i - 1] : a0;
                            const next = i < lastIdx - 1 ? pts[i + 2] : a1;
                            const cp1x = a0.x + (a1.x - prev.x) / 6;
                            const cp1y = a0.y + (a1.y - prev.y) / 6;
                            const cp2x = a1.x - (next.x - a0.x) / 6;
                            const cp2y = a1.y - (next.y - a0.y) / 6;

                            const alphaStart = (i / lastIdx) * pass.alphaMul;
                            const alphaEnd = ((i + 1) / lastIdx) * pass.alphaMul;
                            const segGrad = ctx.createLinearGradient(a0.x, a0.y, a1.x, a1.y);
                            if (pass.kind === 'white') {
                                // 白芯高光层：模拟 BA 特效中心亮线
                                segGrad.addColorStop(0, `rgba(255,255,255, ${alphaStart})`);
                                segGrad.addColorStop(1, `rgba(255,255,255, ${alphaEnd})`);
                            } else {
                                const colStart = this.trailColorAt(i / lastIdx);
                                const colEnd = this.trailColorAt((i + 1) / lastIdx);
                                segGrad.addColorStop(0, `rgba(${colStart[0]},${colStart[1]},${colStart[2]}, ${alphaStart})`);
                                segGrad.addColorStop(1, `rgba(${colEnd[0]},${colEnd[1]},${colEnd[2]}, ${alphaEnd})`);
                            }

                            ctx.beginPath();
                            ctx.moveTo(a0.x, a0.y);
                            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, a1.x, a1.y);
                            ctx.strokeStyle = segGrad;
                            ctx.stroke();
                        }}
                } else {
                    // 逐段渲染（直线版）
                    for (const pass of passes) {
                        ctx.lineWidth = pass.lineWidth;
                        for (let i = 0; i < lastIdx; i++) {
                            const alphaStart = (i / lastIdx) * pass.alphaMul;
                            const alphaEnd = ((i + 1) / lastIdx) * pass.alphaMul;
                            const a0 = pts[i];
                            const a1 = pts[i + 1];

                            const segGrad = ctx.createLinearGradient(a0.x, a0.y, a1.x, a1.y);
                            if (pass.kind === 'white') {
                                segGrad.addColorStop(0, `rgba(255,255,255, ${alphaStart})`);
                                segGrad.addColorStop(1, `rgba(255,255,255, ${alphaEnd})`);
                            } else {
                                const colStart = this.trailColorAt(i / lastIdx);
                                const colEnd = this.trailColorAt((i + 1) / lastIdx);
                                segGrad.addColorStop(0, `rgba(${colStart[0]},${colStart[1]},${colStart[2]}, ${alphaStart})`);
                                segGrad.addColorStop(1, `rgba(${colEnd[0]},${colEnd[1]},${colEnd[2]}, ${alphaEnd})`);
                            }

                            ctx.beginPath();
                            ctx.moveTo(a0.x, a0.y);
                            ctx.lineTo(a1.x, a1.y);
                            ctx.strokeStyle = segGrad;
                            ctx.stroke();
                        }}
                }

                // 光标端柔光晕：点亮当前触点，增强材质感（渐变拖尾开启时）
                if (preset.headGlow > 0 && gradientOn && this.lastPos) {
                    const head = this.lastPos;
                    const hr = 13 * this.scale;
                    const hgAlpha = this.alpha(preset.headGlow);
                    const main = parseRgbList(this.color);
                    const core = mixTowardWhite(main, 0.85);
                    const hg = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, hr);
                    hg.addColorStop(0, `rgba(${core[0]},${core[1]},${core[2]}, ${hgAlpha})`);
                    hg.addColorStop(0.45, `rgba(${main[0]},${main[1]},${main[2]}, ${hgAlpha * 0.55})`);
                    hg.addColorStop(1, `rgba(${main[0]},${main[1]},${main[2]}, 0)`);
                    ctx.fillStyle = hg;
                    ctx.beginPath();
                    ctx.arc(head.x, head.y, hr, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowColor = 'transparent';
            }

            _strokeRingSegment(wx, wy, radius, a0, a1, lineWidth, strokeStyle) {
                const ctx = this.bufferCtx;
                ctx.beginPath();
                ctx.arc(wx, wy, radius, a0, a1);
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = strokeStyle;
                ctx.stroke();
            }

            _updateWaves(clickFrameScale) {
                const filled = FILLED_CIRCLE_CFG;
                const rings = RINGS_ANIM_CFG;
                const ctx = this.bufferCtx;

                const updateFilledCircle = (w, waveProg) => {
                    w.life += clickFrameScale;
                    const ease = 1 - Math.pow(1 - waveProg, 3);
                    w.r = filled.rAddRate * this.scale * ease;
                    const alpha = Math.max(0, 1 - waveProg);
                    if (alpha > 0) {
                        ctx.beginPath();
                        ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
                        if (this.preset.radialFill && this.ringGradient && this.ringGradientStrength > 0) {
                            // 圆内渐变（光圈）：白热核心→主色→副色→透明边缘
                            const main = parseRgbList(this.color);
                            const core = mixTowardWhite(main, 0.85);
                            const secondary = parseRgbList(this.ringColorSecondary);
                            const edge = lerpRgbList(main, secondary, Math.min(1, this.ringGradientStrength));
                            const grad = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r);
                            grad.addColorStop(0, `rgba(${core[0]},${core[1]},${core[2]}, ${this.alpha(alpha)})`);
                            grad.addColorStop(0.42, `rgba(${main[0]},${main[1]},${main[2]}, ${this.alpha(alpha * 0.92)})`);
                            grad.addColorStop(0.78, `rgba(${edge[0]},${edge[1]},${edge[2]}, ${this.alpha(alpha * 0.55)})`);
                            grad.addColorStop(1, `rgba(${edge[0]},${edge[1]},${edge[2]}, 0)`);
                            ctx.fillStyle = grad;
                        } else {
                            ctx.fillStyle = `rgba(${this.color},${this.alpha(alpha)})`;
                        }
                        ctx.fill();
                    }
                };

                const updateRings = (w, ringProg) => {
                    const getWeightProp = (t) => Math.min(2 - Math.abs(4 * (t - 0.5)), 1);
                    // 圆环渐变：沿弧线位置由主色过渡到副色，起始阶段从白色点火
                    // 光圈渐变关闭时使用上游默认的收敛末端色，保证逐像素还原
                    const mainRgb = parseRgbList(this.color);
                    const secondaryRgb = parseRgbList(this.ringColorSecondary);
                    const washedEndRgb = ringsEndColorFromRgb(this.color);
                    const ringRgbAt = (rProg, alongT) => {
                        const target = this.ringGradient && this.ringGradientStrength > 0
                            ? lerpRgbList(mainRgb, secondaryRgb, Math.min(1, Math.max(0, alongT) * this.ringGradientStrength))
                            : washedEndRgb;
                        const t = Math.min(1.2 * rProg, 1);
                        return [
                            Math.round(this.ringsStartColor[0] * (1 - t) + target[0] * t),
                            Math.round(this.ringsStartColor[1] * (1 - t) + target[1] * t),
                            Math.round(this.ringsStartColor[2] * (1 - t) + target[2] * t),
                        ];
                    };
                    const getAlpha = (rProg) => Math.min(1.1 - 0.3 * rProg, 1);
                    const ringGlowBlur = this.preset.ringGlow * this.scale;

                    const r = w.ring;
                    r.ang -= r.rs * clickFrameScale;

                    let start = 0;
                    let end = 0;
                    let len = 0;
                    let seg;

                    for (let i = 0; i < 2; i++) {
                        seg = r.segs[i];
                        const base = r.ang + seg.off;

                        if (ringProg <= rings.lenStopAddPoint) {
                            len = seg.len * (ringProg / rings.lenStopAddPoint);
                            end = base + seg.len;
                            start = end - len;
                        } else if (ringProg > rings.lenStartDimPoint) {
                            len = seg.len * (1 - (ringProg - rings.lenStartDimPoint) / (1 - rings.lenStartDimPoint));
                            start = base;
                            end = start + len;
                        } else {
                            len = seg.len;
                            start = base;
                            end = start + len;
                        }

                        const lineWidthMul = Math.min(-0.8 * (ringProg - 0.8) + 1, 1);
                        const [gr, gg2, gb] = ringRgbAt(ringProg, 0.5);
                        const alphaRing = getAlpha(ringProg);
                        const radius = w.r + seg.rRoundRate * this.scale;

                        // 辉光层：整段弧线一次性加辉光，避免逐小段开阴影的开销
                        if (ringGlowBlur > 0) {
                            ctx.save();
                            ctx.shadowColor = `rgba(${gr},${gg2},${gb},${alphaRing * 0.6})`;
                            ctx.shadowBlur = ringGlowBlur;
                            ctx.beginPath();
                            ctx.arc(w.x, w.y, radius, start, end);
                            ctx.lineWidth = Math.max(rings.maxW * lineWidthMul * 0.9, rings.minW);
                            ctx.strokeStyle = `rgba(${gr},${gg2},${gb},${alphaRing * 0.35})`;
                            ctx.stroke();
                            ctx.restore();
                        }

                        for (let k = 0; k < rings.segNum; k++) {
                            const t0 = k / rings.segNum;
                            const t1 = (k + 1) / rings.segNum;
                            const a0 = start + (end - start) * t0;
                            const a1 = start + (end - start) * t1;

                            if (Math.abs(a1 - a0) < 0.01) continue;

                            const wT = getWeightProp(t0);
                            const lw = (rings.minW * (1 - wT) + rings.maxW * wT) * lineWidthMul;
                            const [rr, gg, bb] = ringRgbAt(ringProg, t0);
                            const strokeStyle = `rgba(${rr},${gg},${bb},${alphaRing})`;
                            // 光弧
                            this._strokeRingSegment(w.x, w.y, radius, a0, a1, lw, strokeStyle);
                        }
                    }
                };

                for (let i = this.waves.length - 1; i >= 0; i--) {
                    const w = this.waves[i];
                    const waveProg = Math.min(w.life / filled.maxLife, 1);
                    const ringProg = Math.min(w.life / rings.maxLife, 1);

                    updateFilledCircle(w, waveProg);
                    updateRings(w, ringProg);

                    // 回收对象到对象池
                    if (ringProg >= 1 && waveProg >= 1) {
                        this.wavesPool.push(this.waves[i]);
                        this.waves.splice(i, 1);
                    }
                }
            }

            _drawSparkShape(s) {
                const ctx = this.bufferCtx;
                // 三角形火花（与游戏内一致）
                ctx.beginPath();
                ctx.moveTo(0, -s.s);
                ctx.lineTo(s.s * 0.6, s.s * 0.6);
                ctx.lineTo(-s.s * 0.6, s.s * 0.6);
                ctx.closePath();
            }

            _updateSparks(clickFrameScale, trailFrameScale) {
                const ctx = this.bufferCtx;
                const preset = this.preset;
                const main = parseRgbList(this.color);
                const secondary = parseRgbList(this.colorSecondary);
                const gradientOn = this.gradientTrail && this.gradientStrength > 0;
                for (let i = this.sparks.length - 1; i >= 0; i--) {
                    const s = this.sparks[i];
                    const fs = s.fromClick ? clickFrameScale : trailFrameScale;
                    s.x += s.vx * fs;
                    s.y += s.vy * fs;
                    s.vx *= Math.pow(s.f, fs);
                    s.vy *= Math.pow(s.f, fs);
                    s.rot += s.rs * fs;
                    s.a -= 0.032 * fs;
                    if (s.a <= 0) {
                        this.sparksPool.push(this.sparks[i]);
                        this.sparks.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.translate(s.x, s.y);
                    ctx.rotate(s.rot);
                    this._drawSparkShape(s);
                    if (preset.sparkGlow && gradientOn) {
                        // 粒子渐变：白热中心→主色→副色边缘（随拖尾渐变开关）
                        const edge = lerpRgbList(main, secondary, Math.min(1, this.gradientStrength));
                        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s.s);
                        g.addColorStop(0, `rgba(255,255,255, ${this.alpha(s.a)})`);
                        g.addColorStop(0.5, `rgba(${main[0]},${main[1]},${main[2]}, ${this.alpha(s.a * 0.92)})`);
                        g.addColorStop(1, `rgba(${edge[0]},${edge[1]},${edge[2]}, ${this.alpha(s.a * 0.85)})`);
                        ctx.fillStyle = g;
                    } else {
                        ctx.fillStyle = `rgba(255,255,255,${this.alpha(s.a)})`;
                    }
                    ctx.fill();
                    ctx.restore();
                }
            }

            _canvasRect() {
                return { x: 0, y: 0, w: this.cssWidth, h: this.cssHeight };
            }

            _clipRect(rect) {
                if (!rect) return null;
                const x0 = Math.max(0, Math.floor(rect.x));
                const y0 = Math.max(0, Math.floor(rect.y));
                const x1 = Math.min(this.cssWidth, Math.ceil(rect.x + rect.w));
                const y1 = Math.min(this.cssHeight, Math.ceil(rect.y + rect.h));
                if (x1 <= x0 || y1 <= y0) return null;
                return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
            }

            _pointRect(x, y, padding) {
                return {
                    x: x - padding,
                    y: y - padding,
                    w: padding * 2,
                    h: padding * 2,
                };
            }

            _segmentRect(a, b, padding) {
                const x0 = Math.min(a.x, b.x) - padding;
                const y0 = Math.min(a.y, b.y) - padding;
                const x1 = Math.max(a.x, b.x) + padding;
                const y1 = Math.max(a.y, b.y) + padding;
                return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
            }

            _intersects(a, b) {
                return (
                    a.x <= b.x + b.w &&
                    a.x + a.w >= b.x &&
                    a.y <= b.y + b.h &&
                    a.y + a.h >= b.y
                );
            }

            _unionRect(a, b) {
                const x0 = Math.min(a.x, b.x);
                const y0 = Math.min(a.y, b.y);
                const x1 = Math.max(a.x + a.w, b.x + b.w);
                const y1 = Math.max(a.y + a.h, b.y + b.h);
                return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
            }

            _mergeRects(rects) {
                const merged = [];
                for (const raw of rects) {
                    let rect = this._clipRect(raw);
                    if (!rect) continue;

                    for (let i = 0; i < merged.length; i++) {
                        if (this._intersects(merged[i], rect)) {
                            rect = this._unionRect(merged[i], rect);
                            merged.splice(i, 1);
                            i = -1;
                        }
                    }

                    merged.push(rect);
                }

                return merged;
            }

            _getEffectRects() {
                const rects = [];
                const trailPad = 18 * this.scale + 12;
                const trailPoints =
                    this.lastPos && this.trail.length > 0
                        ? this.trail.concat([{ x: this.lastPos.x, y: this.lastPos.y }])
                        : this.trail;

                if (trailPoints.length === 1) {
                    rects.push(this._pointRect(trailPoints[0].x, trailPoints[0].y, trailPad));
                } else {
                    for (let i = 0; i < trailPoints.length - 1; i++) {
                        rects.push(this._segmentRect(trailPoints[i], trailPoints[i + 1], trailPad));
                    }
                }

                const wavePad = 34 * this.scale + RINGS_ANIM_CFG.maxW + 16;
                for (const wave of this.waves) {
                    const radius = Math.max(wave.r || 0, FILLED_CIRCLE_CFG.rAddRate * this.scale) + wavePad;
                    rects.push(this._pointRect(wave.x, wave.y, radius));
                }

                const maxFrameScale = this.maxDeltaMs / this.baseFrameMs;
                for (const spark of this.sparks) {
                    const speed = Math.hypot(spark.vx || 0, spark.vy || 0);
                    const speedScale = spark.fromClick ? this.clickSpeed : this.trailSpeed;
                    const motionPad = speed * maxFrameScale * speedScale;
                    const sparkPad = Math.max(spark.s || 0, 9 * this.scale) * 2 + motionPad + 12;
                    rects.push(this._pointRect(spark.x, spark.y, sparkPad));
                }

                return this._mergeRects(rects);
            }

            _getRenderRects() {
                if (this.forceFullRedraw) {
                    return [this._canvasRect()];
                }

                return this._mergeRects(this.previousDirtyRects.concat(this._getEffectRects()));
            }

            _clipToRects(ctx, rects) {
                ctx.beginPath();
                for (const rect of rects) {
                    ctx.rect(rect.x, rect.y, rect.w, rect.h);
                }
                ctx.clip();
            }

            _renderToMain(rects) {
                const { mainCtx, mainCanvas, bufferCanvas } = this;
                if (!rects || rects.length === 0) {
                    mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
                    mainCtx.drawImage(bufferCanvas, 0, 0);
                    return;
                }

                const dpr = this.dpr || 1;
                for (const rect of rects) {
                    const sx = Math.max(0, Math.floor(rect.x * dpr));
                    const sy = Math.max(0, Math.floor(rect.y * dpr));
                    const sw = Math.min(mainCanvas.width - sx, Math.ceil(rect.w * dpr));
                    const sh = Math.min(mainCanvas.height - sy, Math.ceil(rect.h * dpr));
                    if (sw <= 0 || sh <= 0) {
                        continue;
                    }

                    mainCtx.clearRect(sx, sy, sw, sh);
                    mainCtx.drawImage(bufferCanvas, sx, sy, sw, sh, sx, sy, sw, sh);
                }
            }

            // 执行动画循环
            animationLoops(now) {
                if (window.renderingPaused) {
                    this.lastFrameTime = now;
                    return;
                }

                const hasWork =
                    this.waves.length > 0 ||
                    this.sparks.length > 0 ||
                    this.trail.length > 0;

                // 无粒子时不持续占用rAF 有外部事件时唤醒
                if (!hasWork) {
                    // 同步时间基准，避免静止后再出现拖尾/波纹时首帧 delta 被顶到 maxDeltaMs
                    this.lastFrameTime = now;
                    if (this.previousDirtyRects.length > 0) {
                        this._clearBufferRects(this.previousDirtyRects);
                        this._renderToMain(this.previousDirtyRects);
                        this.previousDirtyRects = [];
                    }
                    return;
                }

                const deltaMs = Math.min(now - this.lastFrameTime, this.maxDeltaMs);
                this.lastFrameTime = now;
                const baseScale = deltaMs / this.baseFrameMs;
                const trailFrameScale = baseScale * this.trailSpeed;
                const clickFrameScale = baseScale * this.clickSpeed;

                const bctx = this.bufferCtx;
                const renderRects = this._getRenderRects();
                // 优化：减少全局合成模式的影响范围，仅在缓冲层使用 lighter
                bctx.save();
                this._clipToRects(bctx, renderRects);
                bctx.globalCompositeOperation = "lighter";

                this._clearBufferRects(renderRects);
                this._updateTrail(trailFrameScale);
                this._updateWaves(clickFrameScale);
                this._updateSparks(clickFrameScale, trailFrameScale);

                bctx.globalCompositeOperation = "source-over";
                bctx.restore();

                this._renderToMain(renderRects);
                this.previousDirtyRects = this._getEffectRects();
                this.forceFullRedraw = false;

                window.scheduleNextAnimationFrame();
            }
        }

        window.spark = new MouseSpark();
        window.renderingPaused = false;
        window.animationFramePending = false;

        let lastBoomX = -1, lastBoomY = -1;
        let lastBoomTime = 0;
        let lastMoveX = -1, lastMoveY = -1;

        window.scheduleNextAnimationFrame = () => {
            if (window.renderingPaused || window.animationFramePending || !window.spark) {
                return;
            }

            window.animationFramePending = true;
            requestAnimationFrame((nextNow) => {
                window.animationFramePending = false;
                window.spark.animationLoops(nextNow);
            });
        };

        window.setRenderingPaused = (paused) => {
            window.renderingPaused = Boolean(paused);
            if (window.renderingPaused) {
                window.animationFramePending = false;
                lastBoomX = -1;
                lastBoomY = -1;
                lastMoveX = -1;
                lastMoveY = -1;
                if (window.spark) {
                    window.spark.clearEffects();
                }
                return;
            }

            window.scheduleNextAnimationFrame();
        };

        // C# 通信接口

        window.currentInputMode = "mouse";
        window.enableAlwaysTrailEffect = false;
        window.effectiveAlwaysTrail = false;

        window.setInputContext = (mode, alwaysTrailEnabled) => {
            window.currentInputMode = mode === "touch" ? "touch" : "mouse";
            window.enableAlwaysTrailEffect = Boolean(alwaysTrailEnabled);
            window.effectiveAlwaysTrail = window.currentInputMode === "mouse" && window.enableAlwaysTrailEffect;
        };

        window.setInputContext("mouse", false);

        // 接收 C# 传来的物理百分比 (0.0 ~ 1.0)，由前端根据真实的画布宽度自行计算
        window.externalBoom = (percentX, percentY) => {
            if (window.renderingPaused) return;
            const now = Date.now();
            if (percentX === lastBoomX && percentY === lastBoomY && (now - lastBoomTime) < 25) return;
            lastBoomX = percentX;
            lastBoomY = percentY;
            lastBoomTime = now;

            // 百分比乘以 WebView 当前真实的内部宽度
            const cx = percentX * window.innerWidth;
            const cy = percentY * window.innerHeight;
            window.dispatchEvent(new MouseEvent('mousedown', { clientX: cx, clientY: cy, bubbles: true }));
            window.scheduleNextAnimationFrame();
        };

        window.externalMove = (percentX, percentY) => {
            if (window.renderingPaused) return;
            if (percentX === lastMoveX && percentY === lastMoveY) return;
            lastMoveX = percentX;
            lastMoveY = percentY;

            // 方法与上述相同
            const cx = percentX * window.innerWidth;
            const cy = percentY * window.innerHeight;
            window.dispatchEvent(new MouseEvent('mousemove', { clientX: cx, clientY: cy, bubbles: true }));
            window.scheduleNextAnimationFrame();
        };

        window.externalUp = () => {
            if (window.renderingPaused) return;
            window.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
            window.scheduleNextAnimationFrame();
        };

        window.updateColor = (rgbString) => {
            if (window.spark) {
                window.spark.color = rgbString;
                window.spark.applyStyle();
            }
        };

        // 完整色彩风格设置：主颜色 / 拖尾副颜色 / 拖尾渐变 / 拖尾渐变强度 / 光圈副颜色 / 光圈渐变 / 光圈渐变强度
        window.updateColorStyle = (mainColor, secondaryColor, gradientTrail,
                                   gradientStrength, ringSecondaryColor, ringGradient, ringGradientStrength) => {
            if (!window.spark) return;
            window.spark.color = mainColor;
            if (typeof secondaryColor === 'string' && secondaryColor.length > 0) {
                window.spark.colorSecondary = secondaryColor;
            }
            window.spark.gradientTrail = Boolean(gradientTrail);
            window.spark.gradientStrength = clampStrength(gradientStrength, window.spark.gradientStrength);
            if (typeof ringSecondaryColor === 'string' && ringSecondaryColor.length > 0) {
                window.spark.ringColorSecondary = ringSecondaryColor;
            }
            window.spark.ringGradient = Boolean(ringGradient);
            window.spark.ringGradientStrength = clampStrength(ringGradientStrength, window.spark.ringGradientStrength);
            window.spark.applyStyle();
        };

        window.updateEffectSettings = (scale, opacity, trailSpeed, clickSpeed) => {
            if (!window.spark) return;
            window.spark.scale = Math.max(0.5, Math.min(3, Number(scale) || 1.5));
            window.spark.opacity = Math.max(0.1, Math.min(1, Number(opacity) || 1.0));
            let t = Number(trailSpeed);
            if (!Number.isFinite(t)) t = 1.0;
            let c = Number(clickSpeed);
            if (!Number.isFinite(c)) c = t;
            window.spark.trailSpeed = Math.max(0.2, Math.min(3, t));
            window.spark.clickSpeed = Math.max(0.2, Math.min(3, c));
        };
    </script>
</body>
</html>
